			<!-- set up checkout page make sure to add in two <strong> tags-->
  <main class="wrapper">
    <h2>Place Your Order</h2>

    <form action="thankyou.html" method="post">
      
      <label for="fullname">Full Name:</label><br>
      <input type="text" id="fullname" name="fullname" required><br><br>

      <label for="email">Email Address:</label><br>
      <input type="email" id="email" name="email" required><br><br>

      <label for="phone">Phone Number:</label><br>
      <input type="tel" id="phone" name="phone" required><br><br>

      <label for="product">Select Deck Type:</label><br>
      <select id="product" name="product" required>
        <option value="">--Choose an Option--</option>
        <option value="basic">Basic Deck - $5000</option>
        <option value="premium">Premium Deck - $8500</option>
        <option value="custom">Custom Deck - Contact for Quote</option>
      </select><br><br>

      <label for="quantity">Quantity:</label><br>
      <input type="number" id="quantity" name="quantity" min="1" max="10" value="1"><br><br>

      <label for="notes">Special Instructions:</label><br>
      <textarea id="notes" name="notes" rows="4" cols="40"></textarea><br><br>

      <input type="submit" value="Submit Order">
      <input type="reset" value="Reset Form">

    </form>

    <hr>

    <p>Need help? <a href="mailto:walter@decksbywalt.com">Contact us by email</a>.</p>
  </main>


		<!-- add anchor hyperlink(to jump to top of page)-->
		
<button onclick="topFunction()" id="myBtn" title="Go to top">Top</button>

	  
<script>
// Get the button
let mybutton = document.getElementById("myBtn");

// When the user scrolls down 20px from the top of the document, show the button
window.onscroll = function() {scrollFunction()};

function scrollFunction() {
  if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
    mybutton.style.display = "block";
  } else {
    mybutton.style.display = "none";
  }
}

// When the user clicks on the button, scroll to the top of the document
function topFunction() {
  document.body.scrollTop = 0;
  document.documentElement.scrollTop = 0;
}
</script>
